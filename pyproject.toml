[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hashprobe-mcp"
version = "0.1.0"
description = "Let agents test SHA-256 implementations with Hashprobe's C engine"
readme = "mcp/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "vendor/cjson/LICENSE"]
authors = [{name = "Brian Mboya"}]
dependencies = ["mcp>=2.2,<3", "anyio>=4.8,<5", "pydantic>=2.11,<3"]
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.scripts]
hashprobe-mcp = "hashprobe.__main__:main"

[project.urls]
Repository = "https://github.com/ArcX-Research/hashprobe"
Issues = "https://github.com/ArcX-Research/hashprobe/issues"

[tool.setuptools]
packages = ["hashprobe"]
package-dir = {hashprobe = "mcp/src"}

[tool.setuptools.package-data]
hashprobe = ["bin/hashprobe"]
